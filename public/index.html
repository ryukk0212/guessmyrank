<script>
const R=[["Fer","#8a8f98"],["Bronze","#a9743b"],["Argent","#c5ccd6"],["Or","#f0b43c"],["Platine","#3fb5c9"],["Diamant","#b67cf2"],["Ascendant","#2fcf86"],["Immortel","#e0476b"],["Radiant","#f6e3a1"]];
const C=n=>R.find(r=>r[0]===n)[1];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let uid=ls("om_uid",null);if(!uid){uid="u"+Math.random().toString(36).slice(2,12);sv("om_uid",uid)}
let myPseudo=ls("om_pseudo","");
let myAvatar=ls("om_avatar","");
let tmpAvatar = "";

// --- THEME (appliqué immédiatement pour éviter le flash) ---
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  sv('om_theme', theme);
  if(theme === 'light'){
    document.documentElement.style.removeProperty('--bg');
  } else if(typeof S !== 'undefined' && S && S.bg){
    document.documentElement.style.setProperty('--bg', S.bg);
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}
applyTheme(ls('om_theme', 'dark'));

// --- GENERATEUR DE NEIGE ---
const snowContainer = document.getElementById('snow-container');
for(let i=0; i<40; i++) {
    let flake = document.createElement('div');
    flake.className = 'snow';
    flake.innerHTML = '❄';
    flake.style.left = Math.random() * 100 + 'vw';
    flake.style.animationDuration = Math.random() * 3 + 4 + 's';
    flake.style.opacity = Math.random() * 0.7 + 0.1;
    flake.style.fontSize = Math.random() * 15 + 10 + 'px';
    snowContainer.appendChild(flake);
}

// --- GESTION DES SONS ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (type === 'click') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'success') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'fail') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}
document.addEventListener('click', (e) => { if(e.target.closest('button') || e.target.closest('.rk') || e.target.closest('.opt')) playSound('click'); });

let S={name:"onlymy",tagline:"GUESS MY RANK · VALORANT",accent:"#ff4d8d",bg:"#0b060b",bgImage:"",blur:18,dim:.6,favicon:"",
 submitBlocks:[{id:"clip",w:"half"},{id:"rank",w:"half"},{id:"identity",w:"half"},{id:"platform",w:"half"},{id:"send",w:"full"}],playBlocks:["filters","info","video","ranks"],links:[]};
let clips=[],played=ls("om_played",{}),f={tab:"up",platform:"",rank:"",div:"",file:null,err:"",smurf:false},cur=0,filter="all",pick="";

const gem=n=>`<div class="gem" style="--c:${C(n)}"><img src="ranks/${n.toLowerCase()}.png" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></div>`;

// --- BUG REPORT MODAL ---
function openBug(){
  const m = document.createElement("div"); m.className = "profile-modal";
  m.innerHTML = `<div class="mb">
    <div style="text-align:right;cursor:pointer" onclick="this.closest('.profile-modal').remove()">✕</div>
    <h3 style="margin-top:0; color:#ff4d8d;">Signaler un bug 🐞</h3>
    <label class="f">Ton Pseudo</label>
    <input type="text" id="bug-pseudo" value="${esc(myPseudo)}" placeholder="Anonyme">
    <label class="f" style="margin-top:15px">Description du bug</label>
    <textarea id="bug-desc" rows="4" placeholder="Décris ce qui ne marche pas..."></textarea>
    <label class="f" style="margin-top:15px">Capture d'écran ou Vidéo (Optionnel)</label>
    <input type="file" id="bug-media" accept="image/*,video/*">
    <button class="go" style="margin-top:20px;" onclick="sendBug(this)">Envoyer le rapport</button>
  </div>`;
  document.body.appendChild(m);
}
async function sendBug(btn){
  const modal = btn.closest('.profile-modal');
  const pseudo = modal.querySelector("#bug-pseudo").value;
  const desc = modal.querySelector("#bug-desc").value;
  const file = modal.querySelector("#bug-media").files[0];
  if(!desc) return alert("Décris le bug s'il te plaît !");

  const fd = new FormData();
  fd.append("pseudo", pseudo);
  fd.append("desc", desc);
  if(file) fd.append("media", file);

  btn.textContent = "Envoi..."; btn.disabled = true;
  try {
    const r = await fetch("/api/bugs", {method:"POST", body:fd});
    if(r.ok) {
      modal.innerHTML = `<div class="mb" style="text-align:center;">
        <div style="font-size:52px;margin-bottom:8px;">✅</div>
        <h2 style="color:#2fcf86;margin:0 0 10px;">Merci !</h2>
        <p style="color:var(--mut);margin:0 0 22px;">Ton rapport a bien été transmis.<br>Je vais regarder ça rapidement.</p>

function apply(){
 const r=document.documentElement.style;
 r.setProperty("--p",S.accent);
 const isLight = document.documentElement.getAttribute('data-theme') === 'light';
 if(isLight){ r.removeProperty("--bg"); } else { r.setProperty("--bg",S.bg); }
 document.title=S.name+" · Guess My Rank";if(S.favicon)$("#fav").href=S.favicon;
 const b=$("#bgimg");b.style.backgroundImage=S.bgImage?`url("${S.bgImage}")`:"none";b.style.filter=`blur(${S.blur}px)`;$("#dim").style.opacity=S.bgImage?S.dim:0;
}
function lsz(l){const w=l.w>0?l.w:(l.big?420:210);return `width:min(100%,${w}px);`+(l.h>0?`min-height:${l.h}px;`:"")}

function getAutoLogo(l) {
  if (l.iconImg) return l.iconImg;
  const text = (l.label + " " + l.sub + " " + l.url).toLowerCase();
  if (text.includes("discord")) return "/logos/discord.png";
  if (text.includes("tiktok")) return "/logos/tiktok.png";
  if (text.includes("paypal")) return "/logos/paypal.png";
  if (text.includes("gmail") || text.includes("mailto:") || text.includes("contact")) return "/logos/gmail.png";
  if (text.includes("tunelio")) return "/logos/tunelio.png";
  if (text.includes("uwuanime")) return "/logos/uwuanime.png";
  if (text.includes("medal")) return "/logos/medal.png";
  if (text.includes("youtube") || text.includes("youtu.be")) return "/logos/youtube.png";
  return null;
}

function lk(l,sm){
 const finalImg = getAutoLogo(l);
 const ic = finalImg ? `<img src="${esc(finalImg)}" alt="">` : esc(l.icon||"🔗");
 return `<a class="lk ${sm?"sm":l.big?"big":""}" style="--lc:${esc(l.color)};${sm&&!(l.w>0)?"":lsz(l)}" href="${safe(l.url)}" target="_blank" rel="noopener"><i>${ic}</i><span>${esc(l.label)}${!sm&&l.sub?`<small>${esc(l.sub)}</small>`:""}</span>${sm?"":"<em>↗</em>"}</a>`;
}

const hd=(n,t,s)=>`<div class="step">${n?`<b>${n}</b>`:""}<div><h3>${t}</h3>${s?`<small>${s}</small>`:""}</div></div>`;
const BL={
 clip:n=>hd(n,"Le clip qui va me faire hésiter.","Entre 15 et 90 secondes, avec le son du jeu activé.")+`<div class="tabs"><span class="${f.tab==="up"?"on":""}" onclick="f.tab='up';keep()">⬆ Importer ma vidéo</span><span class="${f.tab==="yt"?"on":""}" onclick="f.tab='yt';keep()">Lien YouTube</span><span class="${f.tab==="medal"?"on":""}" onclick="f.tab='medal';keep()">Lien Medal</span></div>
 ${f.tab==="up"?(f.file&&f.url?`<div class="vprev"><video src="${f.url}" controls playsinline preload="metadata"></video><label class="chg"><input type="file" id="file" accept="video/*" hidden>${esc(f.file.name)} · ${(f.file.size/1048576).toFixed(1)} Mo · <u>changer de vidéo</u></label></div>`:`<label class="drop"><input type="file" id="file" accept="video/*" hidden><div>⬆<br><b>Glisse ta vidéo ici</b><br>ou clique pour choisir un fichier<br><small>MP4, WebM ou MOV · taille libre</small></div></label>`):""}
 ${f.tab==="yt"?`<input type="text" id="yt" placeholder="https://youtube.com/watch?v=..." value="${esc(f.yt||"")}" onchange="keep()">${ytId(f.yt||"")?`<div class="vprev"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(f.yt)}" allowfullscreen></iframe></div>`:""}`:""}
 ${f.tab==="medal"?`<input type="text" id="medal" placeholder="https://medal.tv/games/..." value="${esc(f.medal||"")}" onchange="keep()">${medalId(f.medal||"")?`<div class="vprev"><iframe src="https://medal.tv/clip/${medalId(f.medal)}/embed" allowfullscreen></iframe></div>`:""}`:""}
 <p class="note">🛡 Ne montre pas ton RANK.</p>`,
 identity:n=>hd(n,"Qui se cache derrière le clip ?","Pour afficher ton nom et te joindre si ton clip est choisi.")+`<div class="two"><div><label class="f">Pseudo à afficher</label><input type="text" id="pseudo" placeholder="Ton pseudo" value="${esc(f.pseudo||"")}"></div><div><label class="f">Pseudo Discord</label><input type="text" id="discord" placeholder="ex. monpseudo" value="${esc(f.discord||"")}"></div></div>`,
 platform:n=>hd(n,"Sur quelle plateforme joues-tu ?","Indique sur quel support tu as enregistré ce clip.")+`<div class="two"><div class="opt ${f.platform==="PC"?"on":""}" onclick="f.platform='PC';keep()"><i></i>PC</div><div class="opt ${f.platform==="Console"?"on":""}" onclick="f.platform='Console';keep()"><i></i>Console</div></div>
 <label class="ck" style="margin-top:15px;color:#ff6b8b;"><input type="checkbox" id="smurf" ${f.smurf?"checked":""} onchange="f.smurf=this.checked;keep()"> 🚨 Mode Smurf (Ce joueur est beaucoup plus fort que son vrai rang)</label>`,
 rank:n=>hd(n,"Ton RANK. À eux de deviner.","Ton rank au moment où le clip a été enregistré.")+`<div class="ranks">${R.map(([r,c])=>`<div class="rk ${f.rank===r?"on":""}" style="--c:${c}" onclick="f.rank='${r}';f.div='';keep()">${gem(r)}${r}</div>`).join("")}</div>
 ${f.rank&&f.rank!=="Radiant"?`<div class="divs">${[1,2,3].map(d=>`<div class="opt ${f.div==d?"on":""}" onclick="f.div=${d};keep()"><i></i>${d}</div>`).join("")}</div>`:""}
 ${f.rank?`<p class="note">✔ ${esc(f.rank)}${f.div?" "+f.div:""}</p>`:""}`,
 send:()=>`<label class="chk"><input type="checkbox" id="ok" ${f.ok?"checked":""}> Ce clip est le mien. J’autorise sa publication.</label><button class="go" id="send">Envoyer mon clip ›</button><div class="err" id="err">${esc(f.err)}</div>`
};
function submitView(){
 let n=0,o=0;const items=S.submitBlocks.filter(b=>BL[b.id]).map(b=>`<div class="card ${b.w==="full"?"full":""}" style="order:${o++}">${BL[b.id](b.id==="send"?"":String(++n).padStart(2,"0"))}</div>`.replace(/^/,"")),
 W=S.submitBlocks.filter(b=>BL[b.id]);let out="",run=[];
 const flush=()=>{if(!run.length)return;out+=`<div class="cols"><div class="col">${run.filter((_,i)=>i%2===0).join("")}</div><div class="col">${run.filter((_,i)=>i%2===1).join("")}</div></div>`;run=[]};
 W.forEach((b,i)=>{if(b.w==="full"){flush();out+=items[i]}else run.push(items[i])});flush();
 return `<div style="text-align:center;"><h1 class="title-game">Envoie ton clip à ${esc(S.name)}</h1><p class="lead">Ajoute ta vidéo, ton pseudo et ton rank. À nous de deviner.</p></div><div class="grid">${out}</div>`;
}
function keep(){f.pseudo=$("#pseudo")?.value??f.pseudo;f.discord=$("#discord")?.value??f.discord;f.yt=$("#yt")?.value??f.yt;f.medal=$("#medal")?.value??f.medal;f.ok=$("#ok")?.checked??f.ok;f.smurf=$("#smurf")?.checked??f.smurf;render()}
function bindSubmit(){const fi=$("#file");if(fi)fi.onchange=()=>{if(!fi.files[0])return;if(f.url)URL.revokeObjectURL(f.url);f.file=fi.files[0];f.url=URL.createObjectURL(f.file);keep()};$("#send").onclick=send}
async function send(){
 f.pseudo=$("#pseudo").value.trim();f.discord=$("#discord").value.trim();f.yt=$("#yt")?.value.trim()??f.yt;f.medal=$("#medal")?.value.trim()??f.medal;f.ok=$("#ok").checked;f.smurf=$("#smurf")?.checked??false;
 const e=m=>{f.err=m;$("#err").textContent=m};
 if(f.tab==="yt"&&!ytId(f.yt||""))return e("Lien YouTube invalide.");
 if(f.tab==="medal"&&!medalId(f.medal||""))return e("Lien Medal invalide.");
 if(f.tab==="up"&&!f.file)return e("Ajoute une vidéo.");
 if(!f.pseudo)return e("Ajoute un pseudo.");
 if(!f.platform)return e("Choisis PC ou Console.");
 if(!f.rank||(f.rank!=="Radiant"&&!f.div))return e("Sélectionne ton rank.");
 if(!f.ok)return e("Coche la case.");
 $("#send").disabled=true;$("#send").textContent="Envoi…";
 try{
  const fd=new FormData();
  ["pseudo","discord","platform","rank"].forEach(k=>fd.append(k,f[k]||""));fd.append("div",f.rank==="Radiant"?0:f.div);fd.append("uid",uid);fd.append("smurf",f.smurf);
  if(f.tab==="yt")fd.append("yt",ytId(f.yt));else if(f.tab==="medal")fd.append("medal",f.medal);else fd.append("video",f.file);
  const r=await fetch("/api/clips",{method:"POST",body:fd});
  if(!r.ok)throw new Error((await r.json()).error||r.status);
  f={tab:"up",platform:"",rank:"",div:"",file:null,err:"",smurf:false};
  $("#app").innerHTML=nav()+`<div class="card empty"><h1 class="title-game">Clip envoyé ✓</h1><p>Merci ! La communauté peut maintenant deviner ton rank.</p><button class="btn pink" onclick="location.hash='play'">Jouer →</button></div>`+foot();
  renderUserBadge();
  fetch("/api/clips?uid="+encodeURIComponent(uid)).then(r=>r.json()).then(d=>clips=d);
 }catch(x){e("Erreur : "+(x.message||"réessaie"));$("#send").disabled=false;$("#send").textContent="Envoyer mon clip ›"}
}

function playView(){
 let c = null;
 if (defiMode) { c = defiClips[defiCur]; } 
 else {
    const unplayed = clips.filter(x => (filter==="all" || x.platform===filter) && !played[x.id]).sort((a,b)=>a.created-b.created);
    if (unplayed.length > 0) c = unplayed[cur % unplayed.length];
 }

 const B={
  filters:()=>`<div class="bar"><div>${["all","PC","Console"].map(x=>`<button class="btn ${filter===x?"pink":""}" onclick="filter='${x}';cur=0;pick='';render()">${x==="all"?"Tous":x}</button>`).join(" ")}
  ${defiMode?`<button class="btn pink" onclick="stopDefi()">Quitter le défi</button>`:`<button class="btn" onclick="startDefi()">🎯 Mode Défi (10 clips)</button>`}</div>
  <div class="pill">Série : 🔥 ${streak} ${streak>2?'<span class="badge">En feu !</span>':''} &nbsp;|&nbsp; Joués · ${Object.keys(played).length}</div></div>`,
  
  info:()=>c?`<div class="bar"><div><b style="font-size:17px">${esc(c.pseudo)}</b><span class="pill">${esc(c.platform)}</span>${c.smurf?`<span class="pill smurf">SMURF 🚨</span>`:""}${played[c.id]?`<span class="pill">déjà joué</span>`:""}</div>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
     ${!defiMode?`
     <button class="btn" style="padding:8px 12px; color:#ff6b8b;" onclick="reportClip('${c.id}')">🚩 Signaler</button>
     <button class="btn" onclick="cur++;pick='';render()">Suivant →</button>`:`<b>Défi : ${defiCur+1}/${defiClips.length}</b>`}
   </div></div>`:"",
   
  video:()=>c?`<div class="card">${c.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(c.yt)}" allowfullscreen allow="autoplay;encrypted-media;fullscreen"></iframe>`:c.medal?`<iframe src="https://medal.tv/clip/${medalId(c.medal)}/embed" allowfullscreen allow="autoplay;encrypted-media;fullscreen"></iframe>`:`<video src="${esc(c.url)}" controls playsinline></video>`}</div>`
   :`<div class="card empty"><h1 class="title-game">Tout est joué !</h1><p>Tu as deviné tous les clips. Reviens plus tard !</p><br><button class="btn pink" onclick="location.hash='submit'">Envoyer un clip</button></div>`,
   
  ranks:()=>c?`<div class="card"><div class="ranks nine" id="pr">${R.map(([r,col])=>`<div class="rk ${pick===r?"on":""}" data-r="${r}" style="--c:${col}" onclick="pickRank('${r}')">${gem(r)}${r}</div>`).join("")}</div>
   <button class="go" id="val" style="margin-top:14px" ${pick?"":"disabled"} onclick="validate('${c.id}')">Valider mon RANK →</button></div>`:""
 };
 
 return `<div style="text-align:center;"><h1 class="title-game">À toi de trouver le vrai rank</h1><p class="lead">Un clip. Ton instinct. La révélation.</p></div><div class="stack">${S.playBlocks.map(k=>B[k]?.()||"").join("")}</div>`;

function pickRank(r){pick=r;document.querySelectorAll("#pr .rk").forEach(e=>e.classList.toggle("on",e.dataset.r===r));$("#val").disabled=false}

function startDefi(){
 if(!myPseudo){ openProfile(); return; }
 let pool = clips.filter(c => (filter==="all" || c.platform===filter) && !played[c.id]);
 pool.sort(() => Math.random() - 0.5);
 defiClips = pool.slice(0, 10);
 if (defiClips.length === 0) return alert("Tu as déjà joué à tous les clips !");
 defiMode=true; defiCur=0; defiScore=0; pick=""; render();
}
function stopDefi(){ defiMode=false; render(); }

async function reportClip(id){
 if(!confirm("Signaler ce clip ?")) return;
 try { await fetch("/api/clips/"+id+"/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:"Signalement"})}); alert("Signalé !"); } catch(e) {}
}

async function validate(id){
 if (played[id]) return alert("Tu as déjà voté !");
 const c=clips.find(x=>x.id===id);if(!c)return;
 if(!myPseudo){ openProfile(); return; }
 
 const r=await fetch("/api/clips/"+id+"/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid,pseudo:myPseudo,avatar:myAvatar,rank:pick})});
 if(!r.ok)return alert("Erreur.");
 const d=await r.json();played[id]=d.mine;sv("om_played",played);
 const ok=d.mine===d.rank;
 if(ok){ playSound('success'); streak++; defiScore++; } else { playSound('fail'); streak=0; }
 sv("om_streak",streak);
 
 if(defiMode){ modalDefi(d,ok); } 
 else { modal(d,ok, id); }
}
function modalDefi(d,ok){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="mb"><div style="text-align:right;cursor:pointer" id="x">✕</div><div class="res ${ok?"ok":"ko"}">${ok?"BIEN JOUÉ !":"RATÉ !"}</div>
 ${d.smurf?`<div style="text-align:center;color:#ff4d8d;font-weight:800;margin-bottom:10px;">🚨 C'ÉTAIT UN SMURF !</div>`:""}
 <p style="text-align:center;font-size:18px;font-weight:800;">${ok?"✔":"✖"} ${d.rank} ${d.div||""}</p>
 <button class="go" id="nx" style="margin-top:14px">${defiCur<defiClips.length-1?"Clip suivant ("+(defiCur+2)+"/"+defiClips.length+") →":"Voir mon score final 🏆"}</button></div>`;
 document.body.appendChild(m);
 m.querySelector("#x").onclick=()=>{m.remove();stopDefi()};
 m.querySelector("#nx").onclick=()=>{
   m.remove();
   if(defiCur<defiClips.length-1){ defiCur++; pick=""; render(); }
   else { endDefi(); }
 };
}
function endDefi(){
 $("#app").innerHTML=nav()+`<div class="card empty"><h1 class="title-game">Défi terminé !</h1><p style="font-size:24px;margin:20px 0;">Score : <b style="color:var(--p)">${defiScore} / ${defiClips.length}</b></p>
 <div style="display:flex;gap:10px;justify-content:center;"><button class="btn pink" onclick="startDefi()">Recommencer</button> <button class="btn" onclick="stopDefi()">Quitter</button></div></div>`+foot();
 renderUserBadge();
 defiMode=false;
}
function modal(d,ok,clipId){
 const my=d.mine,t=d.tally,tot=Object.values(t).reduce((a,b)=>a+b,0);
 const rows=R.map(([r,col])=>{const k=t[r]||0,p=tot?Math.round(k/tot*100):0;return `<div class="vr" style="--c:${col}"><div><span>${r}${r===my?` <small style="color:var(--p2)">TON CHOIX</small>`:""}</span><b>${p} % <small style="color:var(--mut)">(${k})</small></b></div><div class="t"><i style="width:${p}%"></i></div></div>`}).join("");
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="mb"><div style="text-align:right;cursor:pointer" id="x">✕</div><div class="res ${ok?"ok":"ko"}">${ok?"BIEN JOUÉ !":"RATÉ !"}</div>
 ${d.smurf?`<div style="text-align:center;color:#ff4d8d;font-weight:800;margin-bottom:12px;">🚨 C'ÉTAIT UN SMURF !</div>`:""}
 ${streak>1?`<div style="text-align:center;color:#ff4d8d;font-weight:800;margin-bottom:12px;">🔥 Série : ${streak} d'affilée !</div>`:""}
 <div class="cmp"><div><small>TON CHOIX</small>${gem(my)}<b>${my}</b></div><div class="g"><small>SON VRAI RANK</small>${gem(d.rank)}<b>${d.rank}${d.div?" "+d.div:""}</b></div></div>
 <div class="acc" id="acc"><span>Voir les votes du public</span><span>${tot} vote${tot>1?"s":""} ⌄</span></div><div id="vt" hidden>${rows}<small style="color:var(--mut)">Votes du public au moment de ta validation.</small></div>
 
 <div class="comments-box" id="cmt-box">
   <small style="color:var(--mut)">Discussion :</small>
   <div id="cmt-list" style="margin-top:8px;"></div>
   <div style="display:flex;gap:8px;margin-top:8px;">
     <input type="text" id="cmt-input" placeholder="Laisse un commentaire..." style="padding:8px; font-size:12px;">
     <button class="btn" onclick="sendComment('${clipId}')" style="padding:8px 12px;">Envoyer</button>
   </div>
 </div>

 <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
   <button class="btn" id="share">📤 Partager</button>
   <button class="btn" id="report" style="color:#ff6b8b">🚩 Signaler</button>
   <button class="go" id="nx" style="flex:1;min-width:120px">Next →</button>
 </div></div>`;
 document.body.appendChild(m);
 
 loadComments(clipId);

 m.querySelector("#acc").onclick=()=>{const v=m.querySelector("#vt");v.hidden=!v.hidden};
 m.querySelector("#x").onclick=()=>m.remove();
 m.querySelector("#nx").onclick=()=>{m.remove();cur++;pick="";render();};
 m.querySelector("#share").onclick=()=>{ navigator.clipboard.writeText(location.origin+"#play"); m.querySelector("#share").textContent="✅ Lien copié !"; };
 m.querySelector("#report").onclick=async()=>{ await reportClip(clipId); m.querySelector("#report").textContent="✅ Signalé"; };
}

async function loadComments(clipId){
  try {
    const r = await fetch("/api/clips/"+clipId+"/comments");
    const cmts = await r.json();
    const list = $("#cmt-list");
    if(list) list.innerHTML = cmts.length ? cmts.map(c => `<div class="cmt"><b>${esc(c.pseudo)}</b> : ${esc(c.text)}</div>`).join("") : "<small style='color:var(--mut)'>Aucun commentaire.</small>";
  } catch(e) {}
}
async function sendComment(clipId){
  const input = $("#cmt-input");
  if(!input.value.trim()) return;
  await fetch("/api/clips/"+clipId+"/comment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pseudo:myPseudo,text:input.value})});
  input.value = "";
  loadComments(clipId);
}

addEventListener("hashchange",()=>{pick="";render()});
(async()=>{
 try{S={...S,...await (await fetch("/api/settings")).json()}}catch(e){}
 try{clips=await (await fetch("/api/clips?uid="+encodeURIComponent(uid))).json()}catch(e){}
 apply();render();
 if(!ls("om_onboarded", false)){
   if(myPseudo) sv("om_onboarded", true);
   else setTimeout(showOnboarding, 250);
 }
})();
